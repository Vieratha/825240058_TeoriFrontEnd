<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Mahasiswa</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header id="beranda">
      <h1>Profil Mahasiswa</h1>
      <p>Praktikum untuk Responsive UI</p>
    </header>

    <nav>
      <a href="#beranda">Beranda</a>
      <a href="#profil">Profil</a>
    </nav>

    <article id="profil">
      <h2>Profil Mahasiswa</h2>
      <div class="profil-container">
        <div class="profil-card">
          <img src="profile.png" alt="Foto Profil Mahasiswa" />
          <div class="profil-info">
            <h3>Indra Kurniawan</h3>
            <p>
              Saya adalah mahasiswa dari program studi Sistem Informasi angkatan
              2024 yang memiliki minat dalam pengembangan web, aplikasi, dan
              juga cyber security.
            </p>
          </div>
        </div>
      </div>
    </article>

    <footer>
      <p>&copy; 2026 Profil Mahasiswa</p>
    </footer>
  </body>
</html>
